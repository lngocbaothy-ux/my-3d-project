<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photoreal GLB Viewer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #1b1d21;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    canvas { display: block; }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #e6e6e6;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #overlay.hidden { opacity: 0; }
    #bar {
      width: 220px;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    #bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: #ffffff;
      transition: width 0.2s ease;
    }
    #msg { font-size: 13px; letter-spacing: 0.04em; opacity: 0.85; text-align: center; max-width: 80vw; }
  </style>

  <!-- Three.js via import map (ES modules) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <div id="bar"><i></i></div>
    <div id="msg">Loading scene.glb…</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    /* ------------------------------------------------------------------
       1. Renderer setup & color management
       ------------------------------------------------------------------ */
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.useLegacyLights = false; // physically based light units (matches Blender watts/lux better)

    /* ------------------------------------------------------------------
       2. Shadow map configuration
       ------------------------------------------------------------------ */
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b1d21);

    // Image-based lighting: a neutral studio environment so PBR materials
    // (roughness / metalness) get realistic reflections, like Blender's World.
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envTexture = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    scene.environment = envTexture;

    const camera = new THREE.PerspectiveCamera(
      40,
      window.innerWidth / window.innerHeight,
      0.01,
      1000
    );
    camera.position.set(4, 2.5, 6);

    /* ------------------------------------------------------------------
       3. Realistic lighting rig
       ------------------------------------------------------------------ */
    // Low-intensity ambient fill
    const ambient = new THREE.AmbientLight(0xffffff, 0.15);
    scene.add(ambient);

    // Sun
    const sun = new THREE.DirectionalLight(0xfff4e5, 3.0);
    sun.position.set(5, 10, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.0005;       // prevents shadow acne
    sun.shadow.normalBias = 0.02;    // prevents acne on curved / grazing surfaces
    sun.shadow.radius = 4;           // PCF soft-shadow blur
    sun.shadow.camera.near = 0.1;
    sun.shadow.camera.far = 50;
    sun.shadow.camera.left = -10;
    sun.shadow.camera.right = 10;
    sun.shadow.camera.top = 10;
    sun.shadow.camera.bottom = -10;
    scene.add(sun);
    scene.add(sun.target);

    // Invisible ground that only receives shadows (contact shadow catcher)
    const shadowCatcher = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.ShadowMaterial({ opacity: 0.35 })
    );
    shadowCatcher.rotation.x = -Math.PI / 2;
    shadowCatcher.receiveShadow = true;
    scene.add(shadowCatcher);

    /* ------------------------------------------------------------------
       5. Interaction & smoothness
       ------------------------------------------------------------------ */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true;
    controls.target.set(0, 0.5, 0);

    /* ------------------------------------------------------------------
       4. Model loading & PBR materials
       ------------------------------------------------------------------ */
    const overlay = document.getElementById('overlay');
    const bar = document.querySelector('#bar > i');
    const msg = document.getElementById('msg');

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader); // supports Blender's optional Draco compression

    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
    let mixer = null;

    loader.load(
      'scene.glb',
      (gltf) => {
        const model = gltf.scene;

        model.traverse((child) => {
          if (!child.isMesh) return;

          child.castShadow = true;
          child.receiveShadow = true;

          const materials = Array.isArray(child.material) ? child.material : [child.material];
          materials.forEach((mat) => {
            if (!mat) return;

            // Keep Blender's exported PBR values exactly as authored.
            // (GLTFLoader already maps Principled BSDF -> MeshStandard/PhysicalMaterial.)
            if ('roughness' in mat) mat.roughness = mat.roughness;
            if ('metalness' in mat) mat.metalness = mat.metalness;
            if ('envMapIntensity' in mat) mat.envMapIntensity = 1.0;

            // Crisper textures at grazing angles
            ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap'].forEach((key) => {
              if (mat[key]) mat[key].anisotropy = maxAnisotropy;
            });

            mat.needsUpdate = true;
          });
        });

        scene.add(model);
        frameModel(model);

        // Play the first animation exported from Blender, if any
        if (gltf.animations && gltf.animations.length) {
          mixer = new THREE.AnimationMixer(model);
          mixer.clipAction(gltf.animations[0]).play();
        }

        overlay.classList.add('hidden');
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const pct = (xhr.loaded / xhr.total) * 100;
          bar.style.width = pct.toFixed(0) + '%';
          msg.textContent = `Loading scene.glb… ${pct.toFixed(0)}%`;
        }
      },
      (error) => {
        console.error(error);
        msg.textContent =
          'Could not load scene.glb. Place it next to index.html and serve the folder over HTTP ' +
          '(e.g. "npx serve" or "python -m http.server"); browsers block file:// loading.';
      }
    );

    // Center the camera, shadow frustum and ground on the model's bounds
    function frameModel(model) {
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;

      // Place model on the ground plane
      model.position.y -= box.min.y;
      center.y -= box.min.y;

      controls.target.copy(center);

      const fitDist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov * 0.5));
      const dir = new THREE.Vector3(1, 0.55, 1.35).normalize();
      camera.position.copy(center).addScaledVector(dir, fitDist * 1.1);
      camera.near = Math.max(radius / 1000, 0.001);
      camera.far = radius * 100;
      camera.updateProjectionMatrix();

      controls.minDistance = radius * 0.2;
      controls.maxDistance = radius * 20;
      controls.maxPolarAngle = Math.PI * 0.495; // keep camera above ground
      controls.update();

      // Tight shadow frustum = sharper 2048 shadow texels
      sun.position.copy(center).add(new THREE.Vector3(radius * 2, radius * 4, radius * 3));
      sun.target.position.copy(center);
      const s = radius * 1.6;
      sun.shadow.camera.left = -s;
      sun.shadow.camera.right = s;
      sun.shadow.camera.top = s;
      sun.shadow.camera.bottom = -s;
      sun.shadow.camera.near = radius * 0.1;
      sun.shadow.camera.far = radius * 12;
      sun.shadow.camera.updateProjectionMatrix();

      shadowCatcher.scale.setScalar(radius * 10);
      shadowCatcher.position.set(center.x, 0, center.z);
    }

    /* ------------------------------------------------------------------
       Resize & render loop
       ------------------------------------------------------------------ */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      controls.update(); // required for damping
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
